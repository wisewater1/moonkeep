[pytest]
asyncio_mode = strict
filterwarnings =
    ignore::pytest.PytestUnhandledThreadExceptionWarning
    # asyncio's __del__ on Tasks/Queues/transports raises
    # RuntimeError("Event loop is closed") when GC runs after a TestClient
    # closes its loop. We cancel every task we can identify in the lifespan
    # teardown, but daemon-thread-held references (Scapy sniffers, scapy
    # supersockets) escape that, and the resulting unraisable exception was
    # causing pytest 8+ to report fixture-teardown ERRORs in CI even though
    # all 92 assertions pass. This is the documented workaround.
    ignore::pytest.PytestUnraisableExceptionWarning
