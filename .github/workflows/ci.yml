name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.0.0,<10" "pytest-asyncio==0.23.8" "httpx>=0.27.0"

      - name: Run tests
        run: |
          cd backend
          set -o pipefail
          python -m pytest -v 2>&1 | tee /tmp/test_output.log

      - name: Surface failure details
        if: failure()
        run: |
          echo "=== LAST 120 LINES OF TEST OUTPUT ==="
          tail -120 /tmp/test_output.log || true
          echo ""
          echo "=== FAIL/ERROR LINES ==="
          grep -E "^(FAILED|ERROR|tests/.*FAILED|tests/.*ERROR| *Traceback|RuntimeError|AssertionError|.*Event loop is closed)" /tmp/test_output.log | head -40 || echo "(no matches)"
          echo ""
          echo "=== SUMMARY LINE ==="
          tail -3 /tmp/test_output.log || true
          # Emit each error line as a GitHub annotation so it's visible in the run UI.
          grep -E "^(FAILED|ERROR|.*RuntimeError|.*AssertionError|.*Event loop is closed)" /tmp/test_output.log | head -10 | while IFS= read -r line; do
            # Strip ANSI codes so the annotation reads cleanly.
            clean=$(printf '%s' "$line" | sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g' | head -c 400)
            printf '::error::%s\n' "$clean"
          done || true

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build
        run: |
          cd frontend
          npm run build
